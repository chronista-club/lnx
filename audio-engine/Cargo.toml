[package]
name = "audio-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "audio_engine"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Core audio processing
cpal = "0.16.0"
dasp = "0.11"
ringbuf = "0.4.8"

# FFI and safety
libc = "0.2"

# Async runtime for control messages
tokio = { version = "1.35", features = ["sync", "rt"] }

# Lock-free data structures
crossbeam-channel = "0.5"
atomic_float = "0.1"

# MIDI support
midir = "0.9"

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.13.0"
coreaudio-sys = "0.2"
core-foundation = "0.10.1"

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2  # Some optimization even in debug for audio performance
