# lnx — mise の設定
# タスクは tasks/ 以下の Ruby スクリプト（mise の file task）。一覧は `mise tasks ls`

[task_config]
includes = ["tasks"]

[env]
RUST_LOG = "info"
RUST_BACKTRACE = "1"
# iOS: 既定のシミュレータ（iPad をメイン開発機とする）。同名の端末が runtime ごとにあるので OS も指定する
# （27.0 の runtime は "path not found" で起動できないので 27.2。2026-11-04 に xcodebuild -downloadPlatform iOS で入れ直した）
LNX_IOS_SIM = "iPad Pro 11-inch (M5)"
LNX_IOS_OS = "27.2"

[tools]
# Rust は rust-toolchain.toml（rustup）で固定する。mise には rust を書かない（裁定 2026-09-15、mem_1Cf5RnR2KKVdmemBSpiU9A）
# cargo-watch / cargo-edit / cargo-expand は外した: どのタスクも使わず、mise run のたびに auto_install が走って
# cargo-edit が rustc 1.97 以上を要求して止まる（2026-11-04）
xcodegen = "latest"

# General development tools（git は mise の管理外。Xcode / brew のものを使う）
gh = "latest"
pre-commit = "latest"
