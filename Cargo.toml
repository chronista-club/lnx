[workspace]
resolver = "2"
members = [
    "crates/lnx-protocol",
    "crates/lnx-gear",
    "crates/lnx-client",
    "crates/lnx-server",
]

[workspace.package]
version = "0.1.0-alpha3"
authors = ["Mako"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronista-club/lnx"

[workspace.dependencies]
# FFI and OS
libc = "0.2"

# Async runtime
tokio = { version = "1.35", features = ["sync", "rt"] }

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
