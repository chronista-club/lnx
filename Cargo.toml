[workspace]
resolver = "2"
members = [
    "crates/sizma-engine",
]

[workspace.package]
version = "0.1.0-alpha1"
edition = "2024"
authors = ["Sizma Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronista-club/sizma"

[workspace.dependencies]
# Core audio processing
cpal = "0.16.0"
dasp = "0.11"
ringbuf = "0.4.8"

# FFI and safety
libc = "0.2"

# Async runtime
tokio = { version = "1.35", features = ["sync", "rt"] }

# Lock-free data structures
crossbeam-channel = "0.5"
atomic_float = "0.1"

# MIDI support
midir = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# macOS specific
coreaudio-rs = "0.13.0"
coreaudio-sys = "0.2"
core-foundation = "0.10.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2  # Some optimization even in debug for audio performance