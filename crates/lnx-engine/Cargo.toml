[package]
name = "lnx-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lnx_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Core audio processing
cpal = { workspace = true }
dasp = { workspace = true }
ringbuf = { workspace = true }

# FFI and safety
libc = { workspace = true }

# Async runtime for control messages
tokio = { workspace = true }

# Lock-free data structures
crossbeam-channel = { workspace = true }
atomic_float = { workspace = true }

# MIDI support
midir = { workspace = true }

# Serialization for config
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Audio file format support
hound = { workspace = true }

# NDI SDK bindings for network video/audio streaming
grafton-ndi = { workspace = true, optional = true }

[features]
default = []
ndi = ["dep:grafton-ndi"]  # NDI 6 SDK support

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { workspace = true }
coreaudio-sys = { workspace = true }
core-foundation = { workspace = true }

[[example]]
name = "beatmachine_demo"

[[example]]
name = "beatmachine_demo_with_samples"

[[example]]
name = "simple_tone_test"

[[example]]
name = "audio_debug_test"

[build-dependencies]
cbindgen = "0.29"
