[package]
name = "lnx-server"
description = "LNX サーバ — Signal Hub + Router（Unison / QUIC、Gear 管理）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lnx-server"
path = "src/main.rs"

[dependencies]
lnx-protocol = { path = "../lnx-protocol" }
lnx-gear = { path = "../lnx-gear" }
# crates.io package = club-unison / Rust crate identifier = unison
club-unison = "2.2"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Bonjour 広告（_lnx._udp）
mdns-sd = "0.21"
# サーバの身元（保存する自己署名証明書）とペアリング QR
rcgen = "0.14"
rustls-pemfile = "2.2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
directories = "5"
# --log-file で stdout / stderr をファイルへ向ける（dup2）
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.2"
coremidi-sys = "3.2.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
rustls-pki-types = "1"
tempfile = "3"
lnx-client = { path = "../lnx-client" }
