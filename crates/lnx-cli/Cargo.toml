[package]
name = "lnx-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lnx"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Engine integration
lnx-engine = { path = "../lnx-engine" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging and errors
log = { workspace = true }
env_logger = { workspace = true }
anyhow = "1.0"
thiserror = "2.0"

# Terminal UI
crossterm = "0.28"
ratatui = "0.29"

# Configuration
toml = { workspace = true }
directories = "5.0"

# System info
sysinfo = "0.32"